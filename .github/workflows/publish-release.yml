name: Publish RunPod Hub Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 0
          fi

          gh release create v0.1.0             --target "${GITHUB_SHA}"             --title "v0.1.0 — Bonsai 2 27B RunPod Serverless"             --notes "Initial RunPod Hub release for Bonsai 2 27B Serverless.

          Includes:
          - PrismML llama.cpp CUDA runtime
          - PTQ1_0 default model packing
          - Optional PQ2_0 preset
          - RunPod Serverless handler
          - RunPod Hub configuration
          - Hub validation tests
          - RunPod README badge"
