name: Publish RunPod Hub Release

on:
  push:
    branches: [main]
    paths:
      - ".runpod/release-trigger"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create GitHub release targeting main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.1.1' }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi

          gh release create "$VERSION" \
            --target main \
            --title "$VERSION — Bonsai 2 27B RunPod Serverless" \
            --notes "RunPod Hub release for Bonsai 2 27B Serverless.

          Includes:
          - PrismML llama.cpp CUDA runtime
          - PTQ1_0 default model packing
          - Optional PQ2_0 preset
          - RunPod Serverless handler
          - RunPod Hub configuration and validation tests
          - Release target fixed to the main branch for RunPod Hub cloning"
